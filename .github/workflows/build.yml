name: Build WronGL (Windows & Linux)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Tests
      run: pytest

    - name: Build Executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon="wrongl/resources/icon.ico" --name WronGL --add-data "wrongl/resources;wrongl/resources" --hidden-import=pynput.keyboard._win32 --hidden-import=pynput.mouse._win32 --hidden-import=pystray._win32 --hidden-import=wrongl.ui.history_window --hidden-import=wrongl.ui.settings_window --hidden-import=arabic_reshaper --hidden-import=bidi --collect-data customtkinter --collect-data wordfreq --collect-submodules wrongl wrongl/app.py

    - name: Build Executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon="wrongl/resources/icon.png" --name WronGL --add-data "wrongl/resources:wrongl/resources" --hidden-import=pynput.keyboard._xorg --hidden-import=pynput.mouse._xorg --hidden-import=pystray._xorg --hidden-import=wrongl.ui.history_window --hidden-import=wrongl.ui.settings_window --hidden-import=arabic_reshaper --hidden-import=bidi --collect-data customtkinter --collect-data wordfreq --collect-submodules wrongl wrongl/app.py

    - name: Upload Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: WronGL-Windows
        path: dist/WronGL.exe

    - name: Upload Artifacts (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: WronGL-Linux
        path: dist/WronGL