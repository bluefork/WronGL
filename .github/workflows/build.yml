name: Build WronGL (Windows & Linux)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Linux System Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xclip python3-xlib libxcb-cursor0 libxkbcommon-x11-0 dpkg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Tests
      run: python -m pytest

    - name: Build Executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --icon="wrongl/resources/icon.ico" --name WronGL --add-data "wrongl/resources;wrongl/resources" --hidden-import=pynput.keyboard._win32 --hidden-import=pynput.mouse._win32 --hidden-import=pystray._win32 --hidden-import=wrongl.ui.history_window --hidden-import=wrongl.ui.settings_window --collect-all arabic_reshaper --collect-all bidi --collect-data customtkinter --collect-data wordfreq --collect-submodules wrongl wrongl/app.py

    - name: Compile Windows Installer (Inno Setup)
      if: matrix.os == 'windows-latest'
      run: |
        choco install innosetup -y
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Build Executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --icon="wrongl/resources/icon.png" --name WronGL --add-data "wrongl/resources:wrongl/resources" --hidden-import=pynput.keyboard._xorg --hidden-import=pynput.mouse._xorg --hidden-import=pystray._xorg --hidden-import=wrongl.ui.history_window --hidden-import=wrongl.ui.settings_window --collect-all arabic_reshaper --collect-all bidi --collect-data customtkinter --collect-data wordfreq --collect-submodules wrongl wrongl/app.py

    - name: Build Linux .deb Package
      if: matrix.os == 'ubuntu-latest'
      run: |
        chmod +x build_deb.sh
        ./build_deb.sh

    - name: Upload Windows Installer
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: WronGL-Windows-Installer
        path: installer_out/WronGL_Setup_v1.0.exe

    - name: Upload Linux .deb Installer
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: WronGL-Linux-Deb
        path: dist/WronGL_v1.0_amd64.deb