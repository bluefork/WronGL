name: Build WronGL (Windows & Linux)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # اجازه می‌دهد دستی هم اجرا کنیم

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Tests
      run: pytest

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name WronGL --collect-data customtkinter --collect-data wordfreq wrongl/app.py

    - name: Upload Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: WronGL-Windows
        path: dist/WronGL.exe

    - name: Upload Artifacts (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: WronGL-Linux
        path: dist/WronGL